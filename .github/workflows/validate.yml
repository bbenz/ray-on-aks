name: Validate samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements-dev.txt

      - name: Run the offline checks
        run: python -m pytest

      # The demo dashboard's own suite. Node.js and PowerShell 7 on the runner
      # let it also syntax-check the JavaScript and the deploy script.
      - name: Run the dashboard checks
        run: python -m pytest dashboard/tests

      # These checks compare the samples with the companion articles. They are
      # skipped unless RAY_ON_AKS_DOCS points at a checkout of the article
      # source, which isn't public yet.
      - name: Report skipped documentation checks
        if: always()
        run: python -m pytest tests/test_docs_sync.py -rs
