# NVIDIA device plugin for the autoscaling sample's driver-only GPU pool.
#
# Adapted from the AKS self-managed GPU setup, which applies NVIDIA's static
# DaemonSet (k8s-device-plugin v0.18.0). The nodeSelector is the change: the
# upstream DaemonSet tolerates the sku=gpu taint and has no selector, so it also
# lands on AKS-managed GPU nodes, such as the quickstart's raygpu pool, that
# already run a managed device plugin. Don't run two device plugins on one node.
#
# The pool label covers nodes the cluster autoscaler adds later. The plugin runs
# as root because it serves a socket in the kubelet's host directory.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-resources
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: gpu-resources
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: scalet4
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0@sha256:2d16df5f3f12081b4bd6b317cf697e5c7a195c53cec7e0bab756db02a06b985c
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
