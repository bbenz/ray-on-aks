apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaling-observer
  namespace: ray-scale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-poc-scaling-observer-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-poc-scaling-observer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ray-poc-scaling-observer-nodes
subjects:
  - kind: ServiceAccount
    name: scaling-observer
    namespace: ray-scale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaling-observer
  namespace: ray-scale
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaling-observer
  namespace: ray-scale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaling-observer
subjects:
  - kind: ServiceAccount
    name: scaling-observer
    namespace: ray-scale
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scaling-observer
  namespace: ray-scale
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7500
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: scaling-observer
      nodeSelector:
        agentpool: nodepool1
      containers:
        - name: observer
          image: rayproject/ray:2.58.0-py311-cpu@sha256:5b4128ad47050e80b08a9fac96187e04e7e6dd13abe3f074813818bc86460afe
          command: ["python", "/opt/observer/observe_scaling.py"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: code
              mountPath: /opt/observer
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: scaling-observer-code
