apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-inference
  namespace: ray-learn
spec:
  clusterSelector:
    ray.io/cluster: ray-t4
  submissionMode: K8sJobMode
  entrypoint: python /opt/ray-samples/batch_inference.py --output /tmp/ray-inference-results.jsonl
  shutdownAfterJobFinishes: false
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/agentpool: nodepool1
      containers:
        - name: ray-job-submitter
          image: rayproject/ray:2.58.0-py311-cpu@sha256:5b4128ad47050e80b08a9fac96187e04e7e6dd13abe3f074813818bc86460afe
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
